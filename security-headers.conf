# セキュリティ関連ヘッダー（nginx の add_header は location 単位で継承が切れるため、
# 各 location から include して確実に付与する）

# CSP: すべて同一オリジンから配信する前提。
# - worker-src: PDF.js の worker（同一オリジンの .mjs、フォールバック時は blob:）
# - img-src blob:: 変換結果のプレビュー（Blob URL）
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' blob: data:; font-src 'self'; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'; upgrade-insecure-requests" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Strict-Transport-Security "max-age=31536000" always;
