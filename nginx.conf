# Cloud Run 上の nginx（nginxinc/nginx-unprivileged）向け server 設定。
# イメージ側の /etc/nginx/nginx.conf から /etc/nginx/conf.d/default.conf として読み込まれる。

server_tokens off;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # イメージ既定の mime.types に無い拡張子を補う
    # （.mjs は module worker、.webmanifest は Web App Manifest。nosniff 下では正しい MIME が必須）
    include /etc/nginx/mime.types;
    types {
        application/javascript mjs;
        application/manifest+json webmanifest;
    }

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/manifest+json text/xml application/xml;

    # ハッシュ付きのビルド成果物: 1年キャッシュ
    location ^~ /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # 静的ページの clean URL
    location = /privacy {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=3600" always;
        try_files /privacy.html =404;
    }

    location = /terms {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=3600" always;
        try_files /terms.html =404;
    }

    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # 拡張子付きのファイル（favicon、robots.txt、sitemap.xml など）: 無ければ 404 を返す
    # （SPA の index.html にフォールバックさせない）
    location ~* \.[a-z0-9]+$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    # それ以外は SPA のエントリへ
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
